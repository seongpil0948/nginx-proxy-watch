load_module modules/ngx_otel_module.so;

user  root;
# 권장 값은 CPU 코어 수 이상
# grep -c processor /proc/cpuinfo
worker_processes  16;

events {
    worker_connections  60000;  # 작업자 프로세스가 동시에 처리할 수 있는 접속 수를 정의. (worker_processes * worker_connections = 접속자 수)
    multi_accept        on;     # 한번에 복수의 접속을 허용
    use                 epoll;  # epoll은 수천개의 file descriptor 대량 요청이 발생하는 시스템에 적합
}

# 작업자 프로세스가 동시에 사용할 수 있는 파일 수를 정의
worker_rlimit_nofile 65535;

# for WEB Server
# ---------------------------------
http {
    include       mime.types;
    default_type  application/octet-stream;

    # OpenTelemetry 설정
    otel_exporter {
        endpoint 10.101.91.145:4317;  # OpenTelemetry Collector 엔드포인트
    }

    # 기본 추적 설정 (100% 샘플링)
    split_clients $otel_trace_id $sample_trace {
        100% on;
        * off;
    }
    otel_trace $sample_trace;
    otel_trace_context propagate;
    otel_service_name "nginx-proxy"; 
    otel_resource_attr "service.namespace" "Sonic";
    otel_resource_attr "service.version" "2.0.5";
    otel_resource_attr "service.instance.id" $hostname;

    map $host $target_upstream {
        hostnames;
        default "-"; # 기본값은 '-'로 설정 (로그에 표시될 기본값)
    }
    otel_resource_attr "target_upstream" $target_upstream;

    # Key=Value 형식의 로그 포맷으로 변경 (trace_id, span_id 포함)
    log_format  main  'remote_addr=$remote_addr remote_user="$remote_user" '
                       'time_local="$time_local" request="$request" '
                       'status=$status body_bytes_sent=$body_bytes_sent '
                       'referer="$http_referer" user_agent="$http_user_agent" '
                       'x_forwarded_for="$http_x_forwarded_for"';

    # OpenTelemetry trace_id와 span_id를 포함한 KV 로그 포맷
    log_format  otel_combined  'remote_addr=$remote_addr remote_user="$remote_user" '
                              'time_local="$time_local" request="$request" '
                              'status=$status body_bytes_sent=$body_bytes_sent '
                              'referer="$http_referer" user_agent="$http_user_agent" '
                              'x_forwarded_for="$http_x_forwarded_for" '
                              'request_time=$request_time upstream_response_time=$upstream_response_time '
                              'upstream=$target_upstream trace_id=$otel_trace_id span_id=$otel_span_id';

    access_log  /var/log/nginx/access.log  otel_combined;
    error_log  /var/log/nginx/error.log;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;

    gzip  on;
    gzip_disable "msie6";
    gzip_types      text/plain text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    keepalive_timeout  180;
    keepalive_requests 100000;  # 하나의 keepalive_requests 접속을 통해 서비스되는 최대 요청 수 (기본값 100)

    # If we receive X-Forwarded-Proto, pass it through; otherwise, pass along the
    # scheme used to connect to this server
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
      default $http_x_forwarded_proto;
      ''      $scheme;
    }
    # If we receive X-Forwarded-Port, pass it through; otherwise, pass along the
    # server port the client connected to
    map $http_x_forwarded_port $proxy_x_forwarded_port {
      default $http_x_forwarded_port;
      ''      $server_port;
    }
    # If we receive Upgrade, set Connection to "upgrade"; otherwise, delete any
    # Connection header that may have been passed to this server
    map $http_upgrade $proxy_connection {
      default upgrade;
      '' close;
    }

    # Apply fix for very long server names
    server_names_hash_bucket_size 128;
    # Default dhparam
    ssl_dhparam /etc/nginx/dhparam/dhparam.pem;

    # Set appropriate X-Forwarded-Ssl header based on $proxy_x_forwarded_proto
    map $proxy_x_forwarded_proto $proxy_x_forwarded_ssl {
      default off;
      https on;
    }

    ssl_protocols TLSv1.2 TLSv1.3 SSLv2 SSLv3; # 참고: SSLv2, SSLv3는 보안 취약점으로 사용 중단을 권고합니다. TLSv1.2, TLSv1.3 사용을 권장합니다.
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $proxy_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header X-Forwarded-Ssl $proxy_x_forwarded_ssl;
    proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
    # Mitigate httpoxy attack (see README for details)
    proxy_set_header Proxy "";

    include "/app/conf.d/upstream.conf/*.conf";
    include "/app/conf.d/vhost.conf/*.conf";

    server {
        listen 80 default_server;

        error_page  403 404 405 406 411 497 500 501 502 503 504 505 /error.html;
        location = /error.html {
            root /web;
        }

        location /metrics {
            stub_status on; # stub_status 활성화
            access_log off;
            allow all; # allow 접근을 허용할 주소 설정
            # deny 접근을 허용하지 않을 주소 설정
        }

    }
}