<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@700&display=swap" rel="stylesheet">
    <style>
        html, body { margin: 0; padding: 0; font-family: -apple-system, system-ui, blinkmacsystemfont, 'Noto Sans', '돋움', dotum, helvetica, 'Apple SD Gothic Neo', sans-serif; }
        body { overflow: hidden; transition: color 0.3s ease; color: rgba(0, 0, 0, 5%); }
        a { cursor: pointer; }
        @media print { body { print-color-adjust: exact; } }
        @page { size: a4 landscape; width: 100%; margin: 2rem 2.5rem; print-color-adjust: exact; }

        .error_wrap { margin: 0; padding: 0; list-style: none; box-sizing: border-box; font-size: 1rem; font-weight: 400; text-decoration: none; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; color: #333; background: linear-gradient(270deg,#fe825a,#fd6f41); background-color: #fd490e; width: 100%; height: 100vh; }

        .bg_wrap { margin: 0; padding: 0; list-style: none; box-sizing: border-box; }
        .bg_wrap > ul { margin: 0; padding: 0; list-style: none; box-sizing: border-box; position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
        .bg_wrap > ul > li { margin: 0; padding: 0; list-style: none; box-sizing: border-box; position: absolute; display: block; list-style: none; width: 20px; height: 20px; background: hsla(0,0%,100%,.2); animation: bg-animate 25s linear infinite; bottom: -150px; }
        .bg_wrap > ul > li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0; }
        .bg_wrap > ul > li:nth-child(2) { width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .bg_wrap > ul > li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .bg_wrap > ul > li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .bg_wrap > ul > li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .bg_wrap > ul > li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .bg_wrap > ul > li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .bg_wrap > ul > li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .bg_wrap > ul > li:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .bg_wrap > ul > li:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }
        
        .wrap { margin: 0; padding: 0; list-style: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; position: absolute; inset: 0; padding: 1.75rem; }
        .wrap > article { margin: 0; padding: 0; list-style: none; box-sizing: border-box; }
        .wrap > article > div { display: flex; align-items: center; justify-content: center; }
        .wrap > article > div.page_not_found { margin: 0; padding: 0; list-style: none; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: center; gap: 1rem; font-size: 180px; font-family: 'Black Han Sans', sans-serif;; color: #fff; text-shadow: 0 0 10px #a6a6a6; }
        .wrap > article > div.page_not_found > span.zero { font-size: 140px; vertical-align: baseline; }
        .wrap > article > div.page_not_found > span { animation: jump-ani 1s infinite alternate; line-height: 180px; transform: rotate(-15deg); animation-delay: 0; }
        .wrap > article > div.page_not_found > span:nth-child(2) { animation-delay: 0.5s; }
        .wrap > article > div.page_not_found > span:nth-child(3) { animation-delay: 1s; }
        .wrap > article > div.page_not_found_txt { margin: 0; padding: 0; list-style: none; box-sizing: border-box; font-size: 32px; color: #fff; text-shadow: 0 0 4px #a6a6a6; font-family: 'Black Han Sans', sans-serif; }
        .wrap > article > div.error_desc { margin: 0; padding: 0; list-style: none; box-sizing: border-box; font-size: 16px; color: #fff; text-shadow: 0 0 4px #a6a6a6; font-family: 'Nanum Gothic', sans-serif; font-weight: 700; }
        

        @keyframes bg-animate {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }

            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }


        @keyframes jump-ani {
            0% {
              transform: rotate(-15deg);
            }

            100% {
              transform: rotate(15deg);
            }
          }
    </style>
</head>
<body>
    <div class="error_wrap">
        <div class="bg_wrap">
            <ul>
              <li></li>
              <li></li>
              <li></li>
              <li></li>
              <li></li>
              <li></li>
              <li></li>
              <li></li>
              <li></li>
              <li></li>
            </ul>
        </div>
        <section class="wrap">
          <article>
            <div class="page_not_found">
                <span>4</span>
                <span class="zero">0</span>
                <span>4</span>
            </div>
            <div class="page_not_found_txt">Page Not Found</div>
            <div class="error_desc">
              잘못 접근 하셨습니다.
            </div>
          </article>
        </section>
    </div>
</body>
</html>
