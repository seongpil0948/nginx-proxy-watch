services:
  nginx-proxy:
    build: ../
    container_name: nginx-proxy-test
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx-proxy/local_certs:/etc/nginx/certs:ro 
      - ./nginx-proxy/local_logs/nginx:/var/log/nginx 
      - ./nginx-proxy/local_logs/watcher:/var/log/docker-event-watcher
    environment:
      - LOG_LEVEL=debug # 상세 로그 확인용
    restart: always
    networks:
      - test-network

  # --- 테스트 앱 정의 ---

  # 1. 기본 Vhost 테스트
  app-main:
    build:
      context: .
      dockerfile: ./app-main/Dockerfile
    container_name: app-main-test
    environment:
      - VIRTUAL_HOST=main.test.local
      - VIRTUAL_PORT=8080
      - PORT=8080
      - VIRTUAL_LOCATION_PATH=main
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 2. Group Host 라우팅 테스트 (API 서비스)
  app-api:
    build:
      context: .
      dockerfile: ./app-api/Dockerfile
    container_name: app-api-test
    environment:
      - VIRTUAL_GROUP_HOST=main.test.local
      - VIRTUAL_HOST=api.internal
      - VIRTUAL_PORT=8081
      - PORT=8081
      - VIRTUAL_LOCATION_PATH=api
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 3. Group Host 라우팅 테스트 (Admin 서비스)
  app-admin:
    build:
      context: .
      dockerfile: ./app-admin/Dockerfile
    container_name: app-admin-test
    environment:
      - VIRTUAL_GROUP_HOST=main.test.local
      - VIRTUAL_HOST=admin.internal
      - VIRTUAL_PORT=8082
      - PORT=8082
      - VIRTUAL_LOCATION_PATH=admin
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy
      
  # 4. Group Host 및 Location Path 테스트
  app-group-service-a:
    build:
      context: .
      dockerfile: ./app-group-service-a/Dockerfile
    container_name: app-group-service-a-test
    environment:
      - VIRTUAL_GROUP_HOST=group.test.local
      - VIRTUAL_HOST=serviceA.internal
      - VIRTUAL_PORT=8083
      - PORT=8083
      - VIRTUAL_LOCATION_PATH=serviceA
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 5. 또 다른 Group Host 서비스
  app-group-service-b:
    build:
      context: .
      dockerfile: ./app-group-service-b/Dockerfile
    container_name: app-group-service-b-test
    environment:
      - VIRTUAL_GROUP_HOST=group.test.local
      - VIRTUAL_HOST=serviceB.internal
      - VIRTUAL_PORT=8084
      - PORT=8084
      - VIRTUAL_LOCATION_PATH=serviceB
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 6-7. 쿠키 기반 라우팅 대상 서비스들
  app-cookie-hospital:
    build:
      context: .
      dockerfile: ./app-cookie-hospital/Dockerfile
    container_name: app-cookie-hospital-test
    environment:
      - VIRTUAL_HOST=hospital.internal
      - VIRTUAL_PORT=8085
      - PORT=8085
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  app-cookie-pharmacy:
    build:
      context: .
      dockerfile: ./app-cookie-pharmacy/Dockerfile
    container_name: app-cookie-pharmacy-test
    environment:
      - VIRTUAL_HOST=pharmacy.internal
      - VIRTUAL_PORT=8086
      - PORT=8086
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 8. 쿠키 라우팅 설정 서비스
  app-cookie-router:
    image: alpine:latest
    container_name: app-cookie-router-config
    command: ["tail", "-f", "/dev/null"]
    environment:
      - VIRTUAL_HOST=cookie.test.local
      - VIRTUAL_PORT=80
      - VIRTUAL_COOKIE_NAME=mall_type
      - VIRTUAL_ROUTING_MAP=1:hospital.internal,2:pharmacy.internal
      - VIRTUAL_DEFAULT_UPSTREAM=pharmacy.internal
      # 호스트 헤더 매핑 추가
      - VIRTUAL_HOST_HEADER_MAP=hospital.internal:app-cookie-hospital,pharmacy.internal:app-cookie-pharmacy
    networks:
      - test-network
    depends_on:
      - nginx-proxy
      - app-cookie-hospital
      - app-cookie-pharmacy

  # 9. SSL/HTTPS 테스트
  app-secure:
    build:
      context: .
      dockerfile: ./app-secure/Dockerfile
    container_name: app-secure-test
    environment:
      - VIRTUAL_HOST=secure.test.local
      - VIRTUAL_PORT=8087
      - PORT=8087
      - VIRTUAL_SSL=secure.test.local
      - VIRTUAL_CERT=pem
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 10-11. 로드 밸런싱 테스트 - 동일 서비스 여러 인스턴스
  app-balance-1:
    build:
      context: .
      dockerfile: ./app-balance/Dockerfile
    container_name: app-balance-1
    environment:
      - VIRTUAL_HOST=balance.test.local
      - VIRTUAL_PORT=8088
      - PORT=8088
      - INSTANCE_NAME=Instance-1
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  app-balance-2:
    build:
      context: .
      dockerfile: ./app-balance/Dockerfile
    container_name: app-balance-2
    environment:
      - VIRTUAL_HOST=balance.test.local
      - VIRTUAL_PORT=8089
      - PORT=8089
      - INSTANCE_NAME=Instance-2
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 12. 다중 경로 루트 서비스 (GroupHost로 변경)
  app-multipath-root:
    build:
      context: .
      dockerfile: ./app-multipath/Dockerfile
    container_name: app-multipath-root
    environment:
      - VIRTUAL_HOST=multipath.test.local
      - VIRTUAL_PORT=8090
      - PORT=8090
      - APP_NAME=Multipath Root Service
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 13-17. 다중 경로를 GroupHost로 변경
  app-path1:
    build:
      context: .
      dockerfile: ./app-multipath/Dockerfile
    container_name: app-path1
    environment:
      - VIRTUAL_GROUP_HOST=multipath.test.local
      - VIRTUAL_HOST=path1.internal
      - VIRTUAL_PORT=8091
      - PORT=8091
      - VIRTUAL_LOCATION_PATH=path1
      - APP_NAME=Path1 Service
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  app-path2:
    build:
      context: .
      dockerfile: ./app-multipath/Dockerfile
    container_name: app-path2
    environment:
      - VIRTUAL_GROUP_HOST=multipath.test.local
      - VIRTUAL_HOST=path2.internal
      - VIRTUAL_PORT=8092
      - PORT=8092
      - VIRTUAL_LOCATION_PATH=path2
      - APP_NAME=Path2 Service
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  app-path3:
    build:
      context: .
      dockerfile: ./app-multipath/Dockerfile
    container_name: app-path3
    environment:
      - VIRTUAL_GROUP_HOST=multipath.test.local
      - VIRTUAL_HOST=path3.internal
      - VIRTUAL_PORT=8093
      - PORT=8093
      - VIRTUAL_LOCATION_PATH=path3
      - APP_NAME=Path3 Service
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  app-path4:
    build:
      context: .
      dockerfile: ./app-multipath/Dockerfile
    container_name: app-path4
    environment:
      - VIRTUAL_GROUP_HOST=multipath.test.local
      - VIRTUAL_HOST=path4.internal
      - VIRTUAL_PORT=8094
      - PORT=8094
      - VIRTUAL_LOCATION_PATH=path4
      - APP_NAME=Path4 Service
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  app-path5:
    build:
      context: .
      dockerfile: ./app-multipath/Dockerfile
    container_name: app-path5
    environment:
      - VIRTUAL_GROUP_HOST=multipath.test.local
      - VIRTUAL_HOST=path5.internal
      - VIRTUAL_PORT=8095
      - PORT=8095
      - VIRTUAL_LOCATION_PATH=path5
      - APP_NAME=Path5 Service
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

networks:
  test-network:
    driver: bridge