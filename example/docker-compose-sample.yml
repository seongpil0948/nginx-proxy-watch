services:
  nginx-proxy:
    build: ../
    container_name: nginx-proxy-test
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx-proxy/local_certs:/etc/nginx/certs:ro 
      - ./nginx-proxy/local_logs/nginx:/var/log/nginx 
      - ./nginx-proxy/local_logs/watcher:/var/log/docker-event-watcher
    environment:
      - LOG_LEVEL=debug # 상세 로그 확인용
    restart: always
    networks:
      - test-network # 모든 앱과 프록시를 동일 네트워크에 연결

  # --- 테스트 앱 정의 ---

  # 1. 기본 Vhost 테스트
  app-main:
    build:
      context: .
      dockerfile: ./app-main/Dockerfile
    container_name: app-main-test
    environment:
      - VIRTUAL_HOST=main.test.local
      - VIRTUAL_PORT=8080
      - PORT=8080 # 앱 내부 포트
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 2. Location 기반 라우팅 테스트 (/api 경로)
  app-api:
    build:
      context: .
      dockerfile: ./app-api/Dockerfile
    container_name: app-api-test
    environment:
      - VIRTUAL_HOST=main.test.local # app-main과 동일 호스트
      - VIRTUAL_PORT=8081
      - PORT=8081
      - VIRTUAL_IS_LOCATION=Y
      - VIRTUAL_LOCATION=main.test.local:/api # 라우팅 경로
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 3. Group Host 및 Location Path 테스트
  app-group-service-a:
    build:
      context: .
      dockerfile: ./app-group-service-a/Dockerfile
    container_name: app-group-service-a-test
    environment:
      - VIRTUAL_GROUP_HOST=group.test.local # 그룹 호스트 정의
      - VIRTUAL_HOST=serviceA.internal # 내부 식별용 호스트 (업스트림 이름 생성에 사용될 수 있음)
      - VIRTUAL_PORT=8082
      - PORT=8082
      - VIRTUAL_LOCATION_PATH=serviceA # 그룹 호스트 아래 경로
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # --- 쿠키 라우팅 대상 Upstream 정의 ---
  # 4. 쿠키 라우팅 대상 1 (병원)
  app-cookie-hospital:
    build:
      context: .
      dockerfile: ./app-cookie-hospital/Dockerfile
    container_name: app-cookie-hospital-test
    environment:
      # 이 서비스는 직접 접근되지 않고, 쿠키 라우터의 upstream으로 사용됨
      - VIRTUAL_HOST=hospital.internal # Nginx Upstream 이름으로 사용될 호스트
      - VIRTUAL_PORT=8083
      - PORT=8083
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # 5. 쿠키 라우팅 대상 2 (약국 - 기본값)
  app-cookie-pharmacy:
    build:
      context: .
      dockerfile: ./app-cookie-pharmacy/Dockerfile
    container_name: app-cookie-pharmacy-test
    environment:
      - VIRTUAL_HOST=pharmacy.internal # Nginx Upstream 이름
      - VIRTUAL_PORT=8084
      - PORT=8084
    restart: always
    networks:
      - test-network
    depends_on:
      - nginx-proxy

  # --- 쿠키 라우팅 Vhost 정의 ---
  # 6. 쿠키 값에 따라 병원/약국으로 라우팅하는 서비스
  app-cookie-router:
    # 이 서비스는 실제 앱 코드를 실행하지 않고, Nginx 설정 생성을 유발함
    # 따라서 어떤 이미지를 사용하든 크게 상관없으나, 구분을 위해 별도 정의하거나
    # 경량 이미지(alpine 등) 또는 nginx-proxy 이미지 재사용 가능
    image: alpine:latest # 예시로 alpine 사용 (실행될 필요 없음)
    container_name: app-cookie-router-config
    command: ["tail", "-f", "/dev/null"] # 컨테이너가 종료되지 않도록 유지
    environment:
      - VIRTUAL_HOST=cookie.test.local # 이 호스트로 쿠키 라우팅 적용
      - VIRTUAL_PORT=80 # 이 변수는 실제 앱 포트가 아니므로 의미 없을 수 있음 (템플릿에서 사용 안 함)
      # --- 쿠키 라우팅 설정 ---
      - VIRTUAL_COOKIE_NAME=service_type
      - VIRTUAL_ROUTING_MAP=1:hospital.internal,2:pharmacy.internal # 쿠키값:Upstream(VIRTUAL_HOST) 매핑
      - VIRTUAL_DEFAULT_UPSTREAM=pharmacy.internal # 기본 라우팅 대상
      # - VIRTUAL_HOST_HEADER_MAP=hospital.internal:hospital.actual.domain,pharmacy.internal:pharmacy.actual.domain # 필요시 Host 헤더 매핑
    networks:
      - test-network
    depends_on:
      - nginx-proxy
      - app-cookie-hospital # Upstream이 존재해야 함
      - app-cookie-pharmacy # Upstream이 존재해야 함

networks:
  test-network:
    driver: bridge